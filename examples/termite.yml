repo:
  path: D:\projects\your-project
  upstream: git@github.com:upstream-owner/project.git
  fork: git@github.com:your-name/project.git
  base_branch: master
  upstream_remote: origin
  fork_remote: fork

# 项目保护只需要规则包、自然语言意图和自动化预设。
protection:
  enabled: false
  project:
    name: your-project
    description: |
      这是一个公开运行的项目。
      RCE、认证绕过、任意文件读写和供应链恶意代码必须立即阻止。
  profiles:
    - baseline
    - rust
    # 启用后 daemon 会从固定 OSV 官方 API 查询锁定依赖版本。
    - osv
  automation: candidate

branches:
  - name: fix/sample-change
    kind: pr
    note: 测试样本分支；可用于单功能投稿，但不是长期维护复杂 PR 队列的主场景。
    sync: rebase
    push: force-with-lease
    tests: []

  - name: my/project
    kind: product
    note: 个人自用主分支，允许混合多个个人补丁，优先保证持续跟随上游。
    sync: rebase
    push: force-with-lease
    tests: []
    # true 时，只有 py_compile/compileall 不会被视为足够的发布前测试。
    require_behavioral_tests: true
    release:
      enabled: true
      tag_prefix: v99.0.
    auto_resolve:
      enabled: false
      max_conflict_files: 1
      max_file_bytes: 40960
      require_tests: true
      allowed_paths:
        - src/

daemon:
  interval_seconds: 1800
  jitter_seconds: 120
  run_on_start: true
  max_consecutive_failures: 3

llm:
  enabled: false
  provider: deep-seek
  model: deepseek-v4-pro
  api_key_env: DEEPSEEK_API_KEY
  # base_url is optional for provider deep-seek/open-ai.
  # base_url: https://api.deepseek.com
  temperature: 0.1
  max_prompt_bytes: 81920
  timeout_seconds: 300
  max_retries: 2
  prompts:
    # 可用占位符：{branch}、{base}、{conflict_files}、{git_status}、{combined_diff}
    conflict_system: |
      你是一个严谨的软件分支维护助手。请分析 Git rebase/merge 冲突，判断是机械冲突还是功能冲突，并给出安全处理建议。不要编造没有出现在 diff 中的代码。
    conflict_user: |
      请分析下面的冲突。

      分支：{branch}
      基线：{base}

      冲突文件：
      {conflict_files}

      Git 状态：
      {git_status}

      Combined diff：
      {combined_diff}
    # 可用占位符：{branch}、{base}、{conflict_files}、{git_status}、{combined_diff}、{file_contents}
    auto_resolve_system: |
      你是一个谨慎的软件维护助手。你只能做低风险兼容性冲突修复。必须只输出 JSON，不要 Markdown，不要解释。
    auto_resolve_user: |
      请分析下面的 Git 冲突，并仅在低风险时返回修复后的完整文件内容。
      如果风险不是 low，files 必须为空。

      分支：{branch}
      基线：{base}
      冲突文件：
      {conflict_files}

      Git 状态：
      {git_status}

      Combined diff：
      {combined_diff}

      冲突文件内容：
      {file_contents}
    # 可用占位符：{report}
    sync_summary_system: |
      你是一个严谨的软件分支维护助手。请只根据同步报告做中文总结，不要编造不存在的提交、测试或冲突。
    sync_summary_user: |
      请总结下面这次 TermiteRS 同步报告。

      要求：
      - 控制在 5 条以内。
      - 说明成功、失败或冲突的分支。
      - 如果全部成功，说明是否已经推送远端。
      - 如果有失败或冲突，给出下一步建议。

      同步报告：
      {report}

notify:
  enabled: false
  subject_prefix: "[TermiteRS]"
  events:
    # true 时，每个分支开始同步前会发送“正在合并”通知。
    sync_start: false
    # true 时，每次同步结束后会调用 LLM 总结，并发送一封总结邮件。
    sync_summary: false
  policy:
    mode: primary-with-fallback
    # first-success: send by order, stop at the first success
    # fanout: send through every enabled channel
    # primary-with-fallback: try channels by order until one succeeds
  channels:
    - name: cloudflare
      kind: cloudflare-email-service
      enabled: false
      api_token_env: CLOUDFLARE_API_TOKEN
      account_id_env: CLOUDFLARE_ACCOUNT_ID
      # api_base_url defaults to https://api.cloudflare.com/client/v4
      from: termite@example.com
      to:
        - your@qq.com

    - name: qq
      kind: smtp
      enabled: true
      smtp_host: smtp.qq.com
      smtp_port: 465
      tls: implicit
      username_env: QQ_SMTP_USER
      password_env: QQ_SMTP_AUTH_CODE
      from: your@qq.com
      to:
        - your@qq.com

# 协作看板服务仅监听 Unix Socket，操作密码必须使用 Argon2id 哈希。
service:
  socket_path: /run/termiters/termiters.sock
  data_dir: /var/lib/termiters
  public_dashboard_url: https://blog.example.com/admin/termite
  operation_password_hash: "REPLACE_WITH_ARGON2ID_HASH"
